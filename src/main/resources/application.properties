server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/parqueadero}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:1234}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.jwt.secret=${JWT_SECRET:cambia-este-secreto-por-uno-de-minimo-32-caracteres}
app.jwt.exp-horas=12
app.qr.vigencia-seg=${QR_SEG:60}
app.dominio-correo=ucundinamarca.edu.co
app.admin.correo=${ADMIN_CORREO:admin@ucundinamarca.edu.co}
app.admin.password=${ADMIN_PASS:admin123}